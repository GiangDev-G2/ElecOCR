[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "elecocr"
version = "0.1.0"
description = "Local electricity-meter OCR backend and training tools"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.116,<1",
  "numpy>=2.0,<3",
  "pillow>=11,<13",
  "pydantic-settings>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
]
training = [
  "albumentations>=1.4,<3",
  "pyyaml>=6.0,<7",
  "torch>=2.4,<3",
  "ultralytics>=8.3,<9",
]

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["backend"]

[[tool.mypy.overrides]]
module = [
  "torch",
  "torch.*",
  "ultralytics",
  "ultralytics.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
  "backend.ai.models.crnn",
  "backend.ai.training.dataset",
]
disallow_subclassing_any = false

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "--strict-markers --strict-config"

[tool.coverage.run]
branch = true
source = ["backend"]
